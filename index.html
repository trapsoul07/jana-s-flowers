<style>
/* Layout: left-aligned editorial column, hero beside a line-drawn flower, product cards under category chips, quiet visit section. Editing tools appear only for people who can edit the page. */
:root {
  --bg: #F6F7F4;
  --surface: #ECF0EA;
  --blush: #F1E4E4;
  --fg: #19211D;
  --muted: #5E6963;
  --line: #D5DAD3;
  --accent: #2E5B49;
  --on-accent: #F6F7F4;
  --danger: #A3322F;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
    --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
  --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: 600 12px/1 var(--body); letter-spacing: 0.08em; border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); gap: 40px; align-items: center; padding-block: 56px 72px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0 0 20px; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(44px, 7.4vw, 84px); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 24px; text-wrap: balance; }
.lead { max-width: 46ch; color: var(--muted); font-size: 18px; margin: 0 0 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--accent); cursor: pointer; background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.sm { min-height: 40px; padding: 0 18px; font-size: 14px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.hero-art { color: var(--accent); background: var(--surface); border-radius: 220px 220px 8px 8px; aspect-ratio: 4 / 5; display: grid; place-items: center; max-width: 100%; }
.hero-art svg { width: 62%; height: auto; }

section { padding-block: 64px; }
h2 { font-family: var(--display); font-weight: 500; font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 32px; max-width: 52ch; }
.note { color: var(--muted); margin: 24px 0 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.item { padding: 32px; border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; min-height: 260px; }
.item:nth-child(2), .item:nth-child(3) { background: var(--blush); }
.item svg { width: 56px; height: 56px; color: var(--accent); }
.item h3 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: auto 0 0; }
.item p { margin: 0; color: var(--muted); font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.chip { font: 600 14px/1 var(--body); padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ph { aspect-ratio: 4 / 3; background: var(--blush); display: grid; place-items: center; color: var(--accent); overflow: hidden; }
.ph svg { width: 44px; height: 44px; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cbody { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: auto; padding-top: 8px; }
.price { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat { font-size: 13px; color: var(--muted); }
.cbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.visit { border-top: 1px solid var(--line); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.facts dd { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.copy { font: 600 12px/1 var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
footer .wrap { padding-block: 32px 120px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }

@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 24px 48px; }
  .hero-art { order: -1; aspect-ratio: 16 / 10; border-radius: 120px 120px 8px 8px; }
  .hero-art svg { width: auto; height: 82%; }
  .grid, .facts, .pgrid { grid-template-columns: minmax(0, 1fr); }
  .item { min-height: 0; padding: 24px; }
  section { padding-block: 48px; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 761px) and (max-width: 960px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: no-preference) {
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .intro header .wrap { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s both; }
  .intro .eyebrow { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both; }
  .intro h1 { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s both; }
  .intro .lead { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s both; }
  .intro .actions { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.55s both; }
  .intro .hero-art { animation: reveal 1.1s cubic-bezier(0.65, 0, 0.2, 1) 0.1s both; }
  .intro .hero-art svg circle, .intro .hero-art svg ellipse, .intro .hero-art svg path { stroke-dasharray: 1; animation: draw 1.4s ease-out 0.7s both; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .copy, .lang button, .chip { transition: background 0.2s, color 0.2s; }
  .btn.primary:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .btn.ghost:hover, .copy:hover { background: var(--accent); color: var(--on-accent); }
}
html { background: #F6F7F4; }
@media (prefers-color-scheme: dark) { html { background: #111613; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  "use strict";

  /* Used only if data.json cannot be loaded. Edit data.json instead. */
  var FALLBACK = {
    shop: { phone: "88669988", hours: "10:00 – 20:00", addrMn: "Дамдинсүрэн гудамж, Carrefour, 1 давхар", addrEn: "Damdinsuren St, Carrefour, 1st floor", fb: "https://www.facebook.com/search/top?q=Jana%20s%20flower" },
    products: []
  };
  var data = FALLBACK;
  var lang = "mn", filter = "";
  try { var sv = localStorage.getItem("jf-lang"); if (sv === "en" || sv === "mn") lang = sv; } catch (e) {}

  var T = {
    mn: {
      eyebrow: "Цэцэг · Ургамал · Гоёл", h1: "Өдөр бүрд тохирох цэцэг",
      lead: "Баглаа цэцэг, сав ургамал, жижиг гоёл чимэглэл болон технологийн хэрэгслийг нэг дор олоорой.",
      call: "Залгах", fb: "Facebook хуудас",
      h2a: "Манай бүтээгдэхүүн", suba: "Цэцгийн дэлгүүрээс гадна өдөр тутмын жижиг хэрэгцээт зүйлс бий.",
      all: "Бүгд", order: "Захиалах", made: "Захиалгаар", out: "Дууссан",
      h2b: "Манайд зочлоорой", subb: "Carrefour худалдааны төвийн 1 давхарт байрлана.",
      tHours: "Цагийн хуваарь", tAddr: "Хаяг", tPhone: "Утас", copy: "Хуулах", copied: "Хуулсан",
      foot: "Дамдинсүрэн гудамж, Улаанбаатар"
    },
    en: {
      eyebrow: "Flowers · Plants · Accessories", h1: "Flowers for every day",
      lead: "Bouquets, potted plants, small jewelry and tech accessories, all in one shop.",
      call: "Call us", fb: "Facebook page",
      h2a: "What we sell", suba: "Beyond flowers, we carry small everyday things you may need.",
      all: "All", order: "Order", made: "Made to order", out: "Sold out",
      h2b: "Visit the shop", subb: "Find us on the 1st floor of Carrefour.",
      tHours: "Opening hours", tAddr: "Address", tPhone: "Phone", copy: "Copy", copied: "Copied",
      foot: "Damdinsuren St, Ulaanbaatar"
    }
  };
  function t(k) { return T[lang][k] || T.mn[k] || k; }

  var ICONS = {
    bouquet: '<circle cx="28" cy="12" r="5"/><circle cx="14" cy="18" r="4"/><circle cx="42" cy="18" r="4"/><path d="M28 17v14M14 22l12 10M42 22L30 32M18 52l10-20 10 20z"/>',
    plant: '<path d="M18 34h20l-3 16H21zM28 34V20M28 26c-8 0-12-5-12-11 8 0 12 4 12 11zM28 22c6 0 10-4 10-9-6 0-10 3-10 9z"/>',
    jewelry: '<path d="M10 10c2 22 10 28 18 28s16-6 18-28"/><path d="M28 38v4"/><path d="M28 42l5 5-5 5-5-5z"/>',
    tech: '<path d="M10 34V28a18 18 0 0 1 36 0v6"/><rect x="8" y="32" width="9" height="14" rx="3"/><rect x="39" y="32" width="9" height="14" rx="3"/>'
  };
  var CATS = [
    { k: "bouquet", mn: "Баглаа цэцэг", en: "Bouquets", dmn: "Төрсөн өдөр, ойн баяр, талархалд зориулсан баглаа.", den: "Bouquets for birthdays, anniversaries and thank-yous." },
    { k: "plant", mn: "Сав ургамал", en: "Potted plants", dmn: "Гэр, ажлын байрыг ногоон болгох сав ургамал.", den: "Plants that bring green into your home or workplace." },
    { k: "jewelry", mn: "Гоёл чимэглэл", en: "Small jewelry", dmn: "Зүүлт, энгэрийн зүүлт зэрэг жижиг гоёл чимэглэл.", den: "Necklaces, pins and other small accessories." },
    { k: "tech", mn: "Технологийн хэрэгсэл", en: "Tech accessories", dmn: "Цэнэглэгч, чихэвч болон бусад дагалдах хэрэгсэл.", den: "Chargers, headphones and other everyday gear." }
  ];
  function catOf(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i]; return CATS[0]; }
  function icon(k) { return '<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[k] + '</svg>'; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pick(mn, en) { return lang === "en" ? (en || mn || "") : (mn || en || ""); }
  function fmtPrice(p) {
    p = String(p || "").trim();
    if (!p) return "";
    if (/^[\d\s,.]+$/.test(p)) { var n = parseInt(p.replace(/\D/g, ""), 10); if (isFinite(n)) return n.toLocaleString("en-US") + "₮"; }
    return p;
  }
  function telHref() {
    var d = String(data.shop.phone || "").replace(/\D/g, "");
    if (!d) return "#";
    return "tel:" + (d.length === 8 ? "+976" + d : "+" + d);
  }
  function fbUrl() { var u = String(data.shop.fb || ""); return /^https:\/\//i.test(u) ? u : ""; }
  function imgSrc(s) { s = String(s || ""); return /^(images\/)[\w.\-\/]+$/.test(s) ? s : ""; }

  function catCard(c) { return '<article class="item">' + icon(c.k) + '<h3>' + esc(c[lang]) + '</h3><p>' + esc(c["d" + lang]) + '</p></article>'; }
  function productCard(p) {
    var c = catOf(p.cat), fb = fbUrl(), src = imgSrc(p.img);
    var st = p.status === "made" ? t("made") : p.status === "out" ? t("out") : "";
    var h = '<article class="card"><div class="ph">' + (src ? '<img src="' + esc(src) + '" alt="" loading="lazy">' : icon(c.k)) + '</div><div class="cbody">' +
      '<span class="tag">' + esc(c[lang]) + '</span><h3>' + esc(pick(p.nameMn, p.nameEn)) + '</h3>';
    var d = pick(p.descMn, p.descEn);
    if (d) h += '<p>' + esc(d) + '</p>';
    h += '<div class="meta">';
    if (p.price) h += '<span class="price">' + esc(fmtPrice(p.price)) + '</span>';
    if (st) h += '<span class="stat">' + esc(st) + '</span>';
    h += '</div>';
    if (fb && p.status !== "out") h += '<div class="cbtns"><a class="btn ghost sm" href="' + esc(fb) + '" target="_blank" rel="noopener">' + t("order") + '</a></div>';
    return h + '</div></article>';
  }
  function productsHTML() {
    var list = Array.isArray(data.products) ? data.products : [];
    var h = '<section id="products"><div class="wrap"><h2>' + t("h2a") + '</h2><p class="sub">' + t("suba") + '</p>';
    if (!list.length) {
      h += '<div class="grid">' + CATS.map(catCard).join("") + '</div>';
    } else {
      var counts = {};
      list.forEach(function (p) { counts[p.cat] = (counts[p.cat] || 0) + 1; });
      if (filter && !counts[filter]) filter = "";
      h += '<div class="chips" role="group"><button type="button" class="chip" data-act="chip" data-cat="" aria-pressed="' + (filter === "") + '">' + t("all") + '</button>';
      CATS.forEach(function (c) {
        if (counts[c.k]) h += '<button type="button" class="chip" data-act="chip" data-cat="' + c.k + '" aria-pressed="' + (filter === c.k) + '">' + esc(c[lang]) + '</button>';
      });
      h += '</div><div class="pgrid">';
      list.filter(function (p) { return !filter || p.cat === filter; }).forEach(function (p) { h += productCard(p); });
      h += '</div>';
    }
    return h + '</div></section>';
  }

  function render() {
    var s = data.shop, fb = fbUrl();
    document.documentElement.lang = lang;
    var h = '<header><div class="wrap"><a class="logo" href="#top">Jana\'s Flowers</a><div class="lang" role="group" aria-label="Language / Хэл">' +
      '<button type="button" data-act="lang" data-lang="mn" aria-pressed="' + (lang === "mn") + '">МН</button>' +
      '<button type="button" data-act="lang" data-lang="en" aria-pressed="' + (lang === "en") + '">EN</button></div></div></header>';
    h += '<main id="top"><div class="hero"><div class="wrap"><div>' +
      '<p class="eyebrow">' + t("eyebrow") + '</p><h1>' + t("h1") + '</h1><p class="lead">' + t("lead") + '</p><div class="actions">' +
      '<a class="btn primary" href="' + esc(telHref()) + '">' + t("call") + ' · ' + esc(s.phone) + '</a>' +
      (fb ? '<a class="btn ghost" href="' + esc(fb) + '" target="_blank" rel="noopener">' + t("fb") + '</a>' : '') +
      '</div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 120 200" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="60" cy="50" r="9" pathLength="1"/><g><ellipse cx="60" cy="25" rx="9" ry="16" pathLength="1"/><ellipse cx="60" cy="25" rx="9" ry="16" transform="rotate(60 60 50)" pathLength="1"/><ellipse cx="60" cy="25" rx="9" ry="16" transform="rotate(120 60 50)" pathLength="1"/><ellipse cx="60" cy="25" rx="9" ry="16" transform="rotate(180 60 50)" pathLength="1"/><ellipse cx="60" cy="25" rx="9" ry="16" transform="rotate(240 60 50)" pathLength="1"/><ellipse cx="60" cy="25" rx="9" ry="16" transform="rotate(300 60 50)" pathLength="1"/></g>' +
      '<path d="M60 99 C58 130 62 160 60 196" pathLength="1"/><path d="M60 150 C40 150 28 138 26 122 C44 122 58 132 60 150Z" pathLength="1"/><path d="M60 128 C80 128 92 116 94 100 C76 100 62 110 60 128Z" pathLength="1"/></svg></div></div></div>';
    h += productsHTML();
    h += '<section class="visit" id="visit"><div class="wrap"><h2>' + t("h2b") + '</h2><p class="sub">' + t("subb") + '</p><dl class="facts">' +
      '<div><dt>' + t("tHours") + '</dt><dd>' + esc(s.hours) + '</dd></div>' +
      '<div><dt>' + t("tAddr") + '</dt><dd>' + esc(pick(s.addrMn, s.addrEn)) + '</dd></div>' +
      '<div><dt>' + t("tPhone") + '</dt><dd class="row"><a href="' + esc(telHref()) + '">' + esc(s.phone) + '</a><button type="button" class="copy" data-act="copy-phone">' + t("copy") + '</button></dd></div>' +
      '<div><dt>Facebook</dt><dd>' + (fb ? '<a href="' + esc(fb) + '" target="_blank" rel="noopener">' + t("fb") + '</a>' : '-') + '</dd></div>' +
      '</dl></div></section></main>';
    h += '<footer><div class="wrap"><span>© 2026 Jana\'s Flowers</span><span>' + esc(t("foot")) + '</span></div></footer>';
    document.getElementById("root").innerHTML = h;
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "lang") { lang = el.getAttribute("data-lang"); try { localStorage.setItem("jf-lang", lang); } catch (x) {} render(); }
    else if (a === "chip") { filter = el.getAttribute("data-cat") || ""; render(); }
    else if (a === "copy-phone") {
      var done = function () { el.textContent = t("copied"); setTimeout(function () { el.textContent = t("copy"); }, 1500); };
      try { navigator.clipboard.writeText(String(data.shop.phone)).then(done, function () {}); } catch (x) {}
    }
  });
  document.addEventListener("error", function (e) {
    if (e.target && e.target.tagName === "IMG") e.target.style.display = "none";
  }, true);

  function start(d) {
    if (d && d.shop && Array.isArray(d.products)) data = d;
    document.documentElement.classList.add("intro");
    render();
    setTimeout(function () { document.documentElement.classList.remove("intro"); }, 2600);
  }
  var started = false;
  function once(d) { if (started) return; started = true; start(d); }
  var timer = setTimeout(function () { once(null); }, 1500);
  fetch("data.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); })
    .then(function (d) { clearTimeout(timer); once(d); })
    .catch(function () { clearTimeout(timer); once(null); });
})();
</script>
</body>
</html>
