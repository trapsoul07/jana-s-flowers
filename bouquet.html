/* Layout: left-aligned editorial column, hero beside a line-drawn flower, product cards under category chips, quiet visit section. Editing tools appear only for people who can edit the page. */
:root {
  --bg: #F6F7F4;
  --surface: #ECF0EA;
  --blush: #F1E4E4;
  --fg: #19211D;
  --muted: #5E6963;
  --line: #D5DAD3;
  --accent: #2E5B49;
  --on-accent: #F6F7F4;
  --danger: #A3322F;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
    --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
  --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: 600 12px/1 var(--body); letter-spacing: 0.08em; border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); gap: 40px; align-items: center; padding-block: 56px 72px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0 0 20px; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(44px, 7.4vw, 84px); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 24px; text-wrap: balance; }
.lead { max-width: 46ch; color: var(--muted); font-size: 18px; margin: 0 0 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--accent); cursor: pointer; background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.sm { min-height: 40px; padding: 0 18px; font-size: 14px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.hero-art { color: var(--accent); background: var(--surface); border-radius: 220px 220px 8px 8px; aspect-ratio: 4 / 5; display: grid; place-items: center; max-width: 100%; }
.hero-art svg { width: 62%; height: auto; }

section { padding-block: 64px; }
h2 { font-family: var(--display); font-weight: 500; font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 32px; max-width: 52ch; }
.note { color: var(--muted); margin: 24px 0 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.item { padding: 32px; border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; min-height: 260px; }
.item:nth-child(2), .item:nth-child(3) { background: var(--blush); }
.item svg { width: 56px; height: 56px; color: var(--accent); }
.item h3 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: auto 0 0; }
.item p { margin: 0; color: var(--muted); font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.chip { font: 600 14px/1 var(--body); padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ph { aspect-ratio: 4 / 3; background: var(--blush); display: grid; place-items: center; color: var(--accent); overflow: hidden; }
.ph svg { width: 44px; height: 44px; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cbody { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: auto; padding-top: 8px; }
.price { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat { font-size: 13px; color: var(--muted); }
.cbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.visit { border-top: 1px solid var(--line); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.facts dd { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.copy { font: 600 12px/1 var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
footer .wrap { padding-block: 32px 120px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }

@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 24px 48px; }
  .hero-art { order: -1; aspect-ratio: 16 / 10; border-radius: 120px 120px 8px 8px; }
  .hero-art svg { width: auto; height: 82%; }
  .grid, .facts, .pgrid { grid-template-columns: minmax(0, 1fr); }
  .item { min-height: 0; padding: 24px; }
  section { padding-block: 48px; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 761px) and (max-width: 960px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: no-preference) {
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .intro header .wrap { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s both; }
  .intro .eyebrow { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both; }
  .intro h1 { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s both; }
  .intro .lead { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s both; }
  .intro .actions { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.55s both; }
  .intro .hero-art { animation: reveal 1.1s cubic-bezier(0.65, 0, 0.2, 1) 0.1s both; }
  .intro .hero-art svg circle, .intro .hero-art svg ellipse, .intro .hero-art svg path { stroke-dasharray: 1; animation: draw 1.4s ease-out 0.7s both; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .copy, .lang button, .chip { transition: background 0.2s, color 0.2s; }
  .btn.primary:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .btn.ghost:hover, .copy:hover { background: var(--accent); color: var(--on-accent); }
}
.hdr-r { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px; }
.navlink { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent); padding: 10px 2px; border-bottom: 1px solid transparent; }
.navlink:hover { border-bottom-color: var(--accent); }
.teaser { padding-block: 0 64px; }
.teaser .wrap { display: grid; gap: 16px; }
.tz { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; background: var(--blush); border-radius: 8px; padding: 40px; }
.tz > div { min-width: 0; flex: 1 1 320px; }
.tz h2 { margin-bottom: 8px; }
.tz .sub { margin: 0; }
html { background: #F6F7F4; }
@media (prefers-color-scheme: dark) { html { background: #111613; } }

/* bouquet builder */
:root { --sage: #A9C5B0; --leaf: #CFE0D3; --handle: #8A5A44; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sage: #3F6150; --leaf: #274236; } }
:root[data-theme="dark"] { --sage: #3F6150; --leaf: #274236; }

.bhead, .builder-wrap { padding-block: 0; }
.bhead .wrap { padding-block: 24px 28px; }
.bhead h1 { font-size: clamp(38px, 6vw, 68px); margin-bottom: 16px; }
.bhead .lead { margin: 0; }
.builder-wrap .wrap { padding-bottom: 72px; }
.builder { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 40px; align-items: start; }

.pal h2 { font-size: 26px; margin: 0 0 12px; }
.pal .sec + .sec { margin-top: 24px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 8px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: grab; touch-action: pan-x; user-select: none; -webkit-user-select: none; font: 500 13px/1.2 var(--body); min-width: 0; }
.tile svg { width: 100%; max-width: 76px; height: auto; display: block; pointer-events: none; }
.tile span { text-align: center; overflow-wrap: anywhere; pointer-events: none; }
.tile:active { cursor: grabbing; }
.tip { color: var(--muted); font-size: 14px; margin: 14px 0 0; }

.work { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.stagewrap { position: relative; width: min(100%, 440px); margin: 0 auto; }
#bsvg { width: 100%; height: auto; display: block; aspect-ratio: 4 / 5; border-radius: 12px; background: var(--surface); background: color-mix(in srgb, var(--blush) 55%, var(--surface)); touch-action: none; user-select: none; -webkit-user-select: none; }
#bsvg .ln, .tile .ln, .ghost-drag .ln { stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
#bsvg .fl, .tile .fl, .ghost-drag .fl { fill: var(--petal); fill-opacity: 0.7; }
#bsvg .core, .tile .core, .ghost-drag .core { fill: var(--core); fill-opacity: 0.9; }
#bsvg .lf, .tile .lf, .ghost-drag .lf { fill: var(--leaf); }
#bsvg .lf2, .tile .lf2, .ghost-drag .lf2 { fill: var(--sage); fill-opacity: 0.9; }
#bsvg .wh, .tile .wh, .ghost-drag .wh { fill: #FFFFFF; fill-opacity: 0.94; }
#bsvg .seed, .tile .seed, .ghost-drag .seed { fill: var(--accent); stroke: none; }
#bsvg .stem { stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; fill: none; }
#bsvg .paper { stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
#bsvg .fold { stroke: var(--accent); stroke-width: 1.2; fill: none; opacity: 0.45; }
#bsvg .rib { stroke: var(--accent); stroke-width: 1; }
#bsvg .it { cursor: grab; }
#bsvg .it.sel { cursor: grabbing; }
#bsvg .selring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 5; pointer-events: none; }
.hint { position: absolute; inset: 0 0 auto 0; top: 30%; text-align: center; color: var(--muted); font-size: 15px; padding: 0 32px; pointer-events: none; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tool { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.tool svg { width: 20px; height: 20px; pointer-events: none; }
.tool:disabled { opacity: 0.35; cursor: default; }
.tool.wide { width: auto; border-radius: 999px; padding: 0 16px; font: 600 14px/1 var(--body); }
.tool.danger { border-color: var(--danger); color: var(--danger); }
.sw { display: grid; gap: 10px; }
.sw .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sw label { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); min-width: 6.5rem; }
.dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.dot[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

.sum { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 14px; }
.sum h3 { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.sum ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.sum li { background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
.sum .none { color: var(--muted); }
.cta2 { display: flex; flex-wrap: wrap; gap: 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 120; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.ghost-drag { position: fixed; z-index: 100; width: 84px; pointer-events: none; transform: translate(-50%, -50%); opacity: 0.92; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.25)); }

@media (max-width: 860px) {
  .builder { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .work { order: 2; }
  .pal { order: 1; }
  .tiles { display: flex; overflow-x: auto; padding-bottom: 8px; gap: 8px; scrollbar-width: thin; }
  .tile { flex: 0 0 88px; }
  .pal .sec + .sec { margin-top: 12px; }
  .pal h2 { font-size: 22px; margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tool, .dot, .tile { transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .tool:not(:disabled):hover { background: var(--accent); color: var(--on-accent); }
  .tile:hover { border-color: var(--accent); }
}
</style>

  }
  function doAction(a, el) {
    if (a === "smaller") withSel(function (it) { it.s = Math.max(0.4, it.s * 0.9); });
    else if (a === "larger") withSel(function (it) { it.s = Math.min(2.2, it.s * 1.1); });
    else if (a === "rotl") withSel(function (it) { it.r -= 15; });
    else if (a === "rotr") withSel(function (it) { it.r += 15; });
    else if (a === "front") withSel(function (it) { S.items.splice(S.items.indexOf(it), 1); S.items.push(it); });
    else if (a === "back") withSel(function (it) { S.items.splice(S.items.indexOf(it), 1); S.items.unshift(it); });
    else if (a === "dup") withSel(function (it) { var c = { id: "i" + (S.seq++), t: it.t, x: it.x + 22, y: it.y + 14, s: it.s, r: it.r + 8 }; clampXY(c); S.items.push(c); sel = c.id; });
    else if (a === "del") withSel(function (it) { S.items.splice(S.items.indexOf(it), 1); sel = ""; });
    else if (a === "undo") { if (undo.length) { try { S = JSON.parse(undo.pop()); } catch (e) {} if (!find(sel)) sel = ""; clearArm = false; refresh(); } }
    else if (a === "clear") {
      if (!S.items.length) return;
      if (!clearArm) { clearArm = true; renderTools(); return; }
      pushUndo(snap()); S.items = []; sel = ""; clearArm = false; refresh();
    }
    else if (a === "paper" || a === "ribbon") {
      var pre = snap(); S[a] = el.getAttribute("data-k"); pushUndo(pre);
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="' + a + '"]'), function (b) { b.setAttribute("aria-pressed", String(b === el)); });
      renderStage(); renderTools(); renderSum(); persist();
    }
  }

  /* ---------- saving a picture, copying the order ---------- */
  function exportPNG() {
    var svg = document.getElementById("bsvg"), clone = svg.cloneNode(true), i;
    var o = svg.querySelectorAll("*"), c = clone.querySelectorAll("*");
    var props = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-linecap", "stroke-linejoin", "stroke-dasharray", "opacity"];
    for (i = 0; i < o.length; i++) {
      var cs = getComputedStyle(o[i]), st = "";
      props.forEach(function (p) { st += p + ":" + cs.getPropertyValue(p) + ";"; });
      c[i].setAttribute("style", st);
    }
    var selg = clone.querySelector("#sel"); if (selg) selg.remove();
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", "800"); clone.setAttribute("height", "1000");
    clone.removeAttribute("class"); clone.removeAttribute("style"); clone.removeAttribute("role");
    var bg = getComputedStyle(document.body).backgroundColor || "#ffffff";
    var inner = '<rect x="0" y="0" width="400" height="520" fill="' + bg + '"/>' + clone.innerHTML +
      '<text x="200" y="512" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2E5B49">Jana\'s Flowers</text>';
    var xml = '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 400 520">' + inner + '</svg>';
    var img = new Image();
    img.onload = function () {
      var cv = document.createElement("canvas"); cv.width = 800; cv.height = 1040;
      cv.getContext("2d").drawImage(img, 0, 0, 800, 1040);
      cv.toBlob(function (b) {
        if (!b) { toast(t("saveFail")); return; }
        var url = URL.createObjectURL(b), a = document.createElement("a");
        a.href = url; a.download = "janas-flowers-bouquet.png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast(t("saved"));
      }, "image/png");
    };
    img.onerror = function () { toast(t("saveFail")); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  }
  function copyText(txt, done) {
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove(); if (done) done();
    };
    try { navigator.clipboard.writeText(txt).then(function () { if (done) done(); }, fallback); } catch (e) { fallback(); }
  }

  /* ---------- pointer handling ---------- */
  function startGhost(k, e) {
    var g = document.createElement("div");
    g.className = "ghost-drag"; g.innerHTML = mini(k);
    g.style.left = e.clientX + "px"; g.style.top = e.clientY + "px";
    document.body.appendChild(g);
    return g;
  }
  document.addEventListener("pointerdown", function (e) {
    if (e.button && e.button !== 0) return;
    var tile = e.target.closest ? e.target.closest(".tile") : null;
    if (tile) { pal = { k: tile.getAttribute("data-k"), x: e.clientX, y: e.clientY, ghost: null, id: e.pointerId }; return; }
    var g = e.target.closest ? e.target.closest("#bsvg .it") : null;
    if (g) {
      var it = find(g.getAttribute("data-id"));
      if (!it) return;
      var p = ptOf(e);
      sel = it.id; clearArm = false;
      drag = { id: it.id, dx: it.x - p.x, dy: it.y - p.y, moved: false, pre: snap(), id2: e.pointerId };
      var gg = document.querySelector('#bsvg .it[data-id="' + it.id + '"]');
      Array.prototype.forEach.call(document.querySelectorAll("#bsvg .it.sel"), function (n) { n.classList.remove("sel"); });
      if (gg) gg.classList.add("sel");
      document.getElementById("sel").innerHTML = ringSVG();
      renderTools();
      e.preventDefault();
      return;
    }
    if (e.target.closest && e.target.closest("#bsvg")) { if (sel) { sel = ""; document.getElementById("sel").innerHTML = ""; Array.prototype.forEach.call(document.querySelectorAll("#bsvg .it.sel"), function (n) { n.classList.remove("sel"); }); renderTools(); } }
  });
  document.addEventListener("pointermove", function (e) {
    if (pal) {
      if (!pal.ghost && Math.hypot(e.clientX - pal.x, e.clientY - pal.y) > 8) pal.ghost = startGhost(pal.k, e);
      if (pal.ghost) { pal.ghost.style.left = e.clientX + "px"; pal.ghost.style.top = e.clientY + "px"; }
    }
    if (drag) {
      var it = find(drag.id);
      if (!it) return;
      var p = ptOf(e);
      it.x = p.x + drag.dx; it.y = p.y + drag.dy; clampXY(it);
      drag.moved = true;
      moveDom(it);
    }
  });
  function endPointer(e, cancelled) {
    if (pal) {
      var pp = pal; pal = null;
      if (pp.ghost) pp.ghost.remove();
      if (cancelled) return;
      if (pp.ghost) {
        var r = document.getElementById("bsvg").getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { var p = ptOf(e); addItem(pp.k, p.x, p.y); }
      } else addItem(pp.k);
    }
    if (drag) {
      var d = drag; drag = null;
      if (d.moved) { pushUndo(d.pre); persist(); renderTools(); }
    }
  }
  document.addEventListener("pointerup", function (e) { endPointer(e, false); });
  document.addEventListener("pointercancel", function (e) { endPointer(e, true); });

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "lang") {
      lang = el.getAttribute("data-lang");
      try { localStorage.setItem("jf-lang", lang); } catch (x) {}
      clearArm = false; shell();
    } else if (a === "save") exportPNG();
    else if (a === "copy") copyText(orderText(), function () { toast(t("copied")); });
    else doAction(a, el);
  });
  document.addEventListener("click", function (e) {
    var f = e.target.closest ? e.target.closest("#fbsend") : null;
    if (f) copyText(orderText(), function () { toast(t("copied")); });
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var it = find(sel);
    if (!it) return;
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); doAction("del"); }
    else if (e.key.indexOf("Arrow") === 0) {
      e.preventDefault();
      var pre = snap(), st = e.shiftKey ? 12 : 4;
      if (e.key === "ArrowLeft") it.x -= st; else if (e.key === "ArrowRight") it.x += st; else if (e.key === "ArrowUp") it.y -= st; else it.y += st;
      clampXY(it); pushUndo(pre); moveDom(it); persist();
    } else if (e.key === "+" || e.key === "=") doAction("larger");
    else if (e.key === "-") doAction("smaller");
  });

  shell();
  fetch("data.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.shop && /^https:\/\//i.test(String(d.shop.fb || ""))) { shopFb = d.shop.fb; renderSum(); }
  }).catch(function () {});
})();
</script>
