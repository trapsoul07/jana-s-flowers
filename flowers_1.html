<style>
/* Layout: left-aligned editorial column, hero beside a line-drawn flower, product cards under category chips, quiet visit section. Editing tools appear only for people who can edit the page. */
:root {
  --bg: #F6F7F4;
  --surface: #ECF0EA;
  --blush: #F1E4E4;
  --fg: #19211D;
  --muted: #5E6963;
  --line: #D5DAD3;
  --accent: #2E5B49;
  --on-accent: #F6F7F4;
  --danger: #A3322F;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
    --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19211D; --blush: #261E20; --fg: #ECEFEA; --muted: #9AA59E;
  --line: #2B352F; --accent: #8FC3A9; --on-accent: #111613; --danger: #E58B87; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.logo { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: 600 12px/1 var(--body); letter-spacing: 0.08em; border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); gap: 40px; align-items: center; padding-block: 56px 72px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0 0 20px; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(44px, 7.4vw, 84px); line-height: 1.02; letter-spacing: -0.01em; margin: 0 0 24px; text-wrap: balance; }
.lead { max-width: 46ch; color: var(--muted); font-size: 18px; margin: 0 0 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--accent); cursor: pointer; background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.sm { min-height: 40px; padding: 0 18px; font-size: 14px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.hero-art { color: var(--accent); background: var(--surface); border-radius: 220px 220px 8px 8px; aspect-ratio: 4 / 5; display: grid; place-items: center; max-width: 100%; }
.hero-art svg { width: 62%; height: auto; }

section { padding-block: 64px; }
h2 { font-family: var(--display); font-weight: 500; font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 32px; max-width: 52ch; }
.note { color: var(--muted); margin: 24px 0 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.item { padding: 32px; border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; min-height: 260px; }
.item:nth-child(2), .item:nth-child(3) { background: var(--blush); }
.item svg { width: 56px; height: 56px; color: var(--accent); }
.item h3 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: auto 0 0; }
.item p { margin: 0; color: var(--muted); font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.chip { font: 600 14px/1 var(--body); padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ph { aspect-ratio: 4 / 3; background: var(--blush); display: grid; place-items: center; color: var(--accent); overflow: hidden; }
.ph svg { width: 44px; height: 44px; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cbody { padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: auto; padding-top: 8px; }
.price { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat { font-size: 13px; color: var(--muted); }
.cbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.visit { border-top: 1px solid var(--line); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.facts dd { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.copy { font: 600 12px/1 var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
footer .wrap { padding-block: 32px 120px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }

@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr); padding-block: 24px 48px; }
  .hero-art { order: -1; aspect-ratio: 16 / 10; border-radius: 120px 120px 8px 8px; }
  .hero-art svg { width: auto; height: 82%; }
  .grid, .facts, .pgrid { grid-template-columns: minmax(0, 1fr); }
  .item { min-height: 0; padding: 24px; }
  section { padding-block: 48px; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 761px) and (max-width: 960px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: no-preference) {
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .intro header .wrap { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s both; }
  .intro .eyebrow { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both; }
  .intro h1 { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s both; }
  .intro .lead { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s both; }
  .intro .actions { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.55s both; }
  .intro .hero-art { animation: reveal 1.1s cubic-bezier(0.65, 0, 0.2, 1) 0.1s both; }
  .intro .hero-art svg circle, .intro .hero-art svg ellipse, .intro .hero-art svg path { stroke-dasharray: 1; animation: draw 1.4s ease-out 0.7s both; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .copy, .lang button, .chip { transition: background 0.2s, color 0.2s; }
  .btn.primary:hover { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .btn.ghost:hover, .copy:hover { background: var(--accent); color: var(--on-accent); }
}
.hdr-r { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px; }
.navlink { font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent); padding: 10px 2px; border-bottom: 1px solid transparent; }
.navlink:hover { border-bottom-color: var(--accent); }
.teaser { padding-block: 0 64px; }
.tz { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; background: var(--blush); border-radius: 8px; padding: 40px; }
.tz > div { min-width: 0; flex: 1 1 320px; }
.tz h2 { margin-bottom: 8px; }
.tz .sub { margin: 0; }
html { background: #F6F7F4; }
@media (prefers-color-scheme: dark) { html { background: #111613; } }

/* flower guide */
:root { --leaf: #CFE0D3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --leaf: #274236; } }
:root[data-theme="dark"] { --leaf: #274236; }

.fhead, .viewer { padding-block: 0; }
.fhead .wrap { padding-block: 24px 28px; }
.fhead h1 { font-size: clamp(38px, 6vw, 68px); margin-bottom: 16px; }
.fhead .lead { margin: 0; }

.picker { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 0 24px; scrollbar-width: thin; }
.picker .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; }
.picker .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--accent)); border: 1px solid rgba(0, 0, 0, 0.12); }

.show { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 48px; align-items: start; padding-bottom: 72px; }
.stage { --tint: #E8A0B4; --petal: #D96A7E; --core: #B8405A; background: var(--surface); background: color-mix(in srgb, var(--tint) 26%, var(--surface)); transition: background 0.7s ease; border-radius: 220px 220px 12px 12px; padding: 44px 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; touch-action: pan-y; }
.art { width: 100%; display: grid; place-items: center; min-height: 300px; }
.art svg { width: min(100%, 340px); height: auto; display: block; overflow: visible; }
.art img { width: min(100%, 340px); aspect-ratio: 4 / 5; object-fit: cover; border-radius: 160px 160px 8px 8px; display: block; }
.art svg .ln { stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.art svg .fl { fill: var(--petal); fill-opacity: 0.62; }
.art svg .core { fill: var(--core); fill-opacity: 0.9; }
.art svg .lf { fill: var(--leaf); }
.art svg .seed { fill: var(--accent); stroke: none; }
.stagebar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.arrow svg { width: 20px; height: 20px; }
.count { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: var(--muted); font-variant-numeric: tabular-nums; }

.info { min-width: 0; padding-top: 8px; }
.info > * { margin: 0 0 18px; }
.info h2 { font-size: clamp(44px, 6.4vw, 72px); line-height: 1; margin-bottom: 14px; }
.info .mean { font-family: var(--display); font-size: clamp(24px, 3vw, 32px); line-height: 1.2; color: var(--accent); }
.info .story { color: var(--muted); font-size: 18px; max-width: 52ch; }
.cols { list-style: none; padding: 0; display: grid; gap: 10px; }
.cols li { display: grid; grid-template-columns: auto minmax(0, 7.5rem) minmax(0, 1fr); align-items: center; gap: 12px; font-size: 15px; }
.cols i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.18); }
.cols b { font-weight: 600; }
.cols span { color: var(--muted); }
.colhead { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.kv { display: grid; gap: 18px; }
.kv div { border-top: 1px solid var(--line); padding-top: 14px; }
.kv dt { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.kv dd { margin: 0; font-size: 17px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.msg { color: var(--muted); padding: 48px 0; }

@keyframes rise2 { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fillin { from { fill-opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .art.drawing svg .ln { stroke-dasharray: 1; animation: draw 1.3s cubic-bezier(0.4, 0, 0.2, 1) both; }
  .art.drawing svg .fl, .art.drawing svg .core, .art.drawing svg .lf, .art.drawing svg .seed { animation: fillin 0.9s ease 0.6s both; }
  .info.enter > * { animation: rise2 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
  .arrow { transition: background 0.2s, color 0.2s; }
  .arrow:hover { background: var(--accent); color: var(--on-accent); }
  .picker .chip { transition: background 0.2s, color 0.2s, border-color 0.2s; }
}

@media (max-width: 860px) {
  .show { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-bottom: 48px; }
  .stage { border-radius: 160px 160px 12px 12px; padding-top: 36px; }
  .cols li { grid-template-columns: auto minmax(0, 6rem) minmax(0, 1fr); }
}
</style>

<script>
(function () {
  "use strict";
  var lang = "mn";
  try { var sv = localStorage.getItem("jf-lang"); if (sv === "en" || sv === "mn") lang = sv; } catch (e) {}

  var T = {
    mn: {

      best: "Тохиромжтой үе", care: "Арчилгаа", colors: "Өнгөний утга",

    },
    en: {

      lead: "Not sure which flower to give? Browse what each one means, when to give it, and how to keep it fresh.",
      best: "Best for", care: "Care", colors: "What the colors mean",
      ask: "Ask about this flower", call: "Call", prev: "Previous flower", next: "Next flower",

    }
  };
  function t(k) { return T[lang][k] || T.mn[k] || k; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pick(mn, en) { return lang === "en" ? (en || mn || "") : (mn || en || ""); }
  function hex(c, d) { return /^#[0-9a-f]{3,8}$/i.test(String(c || "")) ? c : d; }
  function imgSrc(s) { s = String(s || ""); return /^images\/[\w.\-\/]+$/.test(s) ? s : ""; }

  /* ---------- illustrations: simple line drawings, one per flower ---------- */
  function N(v) { return Math.round(v * 10) / 10; }
  function path(d, cls, tr) { return '<path class="' + cls + '" d="' + d + '"' + (tr ? ' transform="' + tr + '"' : '') + ' pathLength="1"/>'; }

  }
  function rad(cnt, cx, cy, off, rx, ry, start, cls) {
    var s = "";
    for (var i = 0; i < cnt; i++) {
      var a = start + i * 360 / cnt;
      s += '<ellipse class="' + cls + '" cx="' + cx + '" cy="' + N(cy - off - ry) + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + N(a) + ' ' + cx + ' ' + cy + ')" pathLength="1"/>';

  }

    for (i = 0; i <= k; i++) { a = i * 2 * Math.PI / k - Math.PI / 2; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }

    return '<path class="' + cls + '" d="' + d + 'Z" pathLength="1"/>';
  }
  function stem(y0, d) { return path(d || ("M100 " + y0 + " C 98 " + (y0 + 40) + ", 102 " + (y0 + 90) + ", 100 256"), "ln"); }
  var LEAVES = path("M100 214 C 72 214, 54 198, 50 176 C 78 180, 96 196, 100 214Z", "ln lf") + path("M100 196 C 128 196, 146 180, 150 158 C 122 162, 104 178, 100 196Z", "ln lf");

  var ART = {
    rose: function () {
      return stem(130) + LEAVES + rad(5, 100, 92, 4, 20, 20, 0, "ln fl") + rad(5, 100, 92, 3, 16, 17, 36, "ln fl") + circ(100, 92, 13, "ln fl") +

    tulip: function () {
      return stem(120) + path("M100 256 C 70 232, 56 192, 62 152 C 82 182, 98 216, 100 256Z", "ln lf") + path("M100 256 C 130 232, 144 192, 138 152 C 118 182, 102 216, 100 256Z", "ln lf") +
        path("M100 122 C 66 118, 60 76, 70 44 C 88 54, 100 84, 100 122Z", "ln fl") + path("M100 122 C 134 118, 140 76, 130 44 C 112 54, 100 84, 100 122Z", "ln fl") +

    sunflower: function () {
      var s = stem(120) + LEAVES + rad(18, 100, 92, 22, 6, 17, 10, "ln fl") + rad(18, 100, 92, 20, 6, 15, 0, "ln fl") + circ(100, 92, 24, "ln core");
      for (var k = 1; k <= 22; k++) { var r = 3.7 * Math.sqrt(k), a = k * 137.5 * Math.PI / 180; s += circ(100 + r * Math.cos(a), 92 + r * Math.sin(a), 1.5, "seed"); }
      return s;
    },
    lily: function () {
      var s = stem(104) + LEAVES, i;
      var back = "M100 96 C 90 82, 92 62, 100 46 C 108 62, 110 82, 100 96Z", front = "M100 96 C 88 78, 90 52, 100 28 C 110 52, 112 78, 100 96Z";
      for (i = 0; i < 6; i++) s += path(back, "ln fl", "rotate(" + (30 + i * 60) + " 100 96)");
      for (i = 0; i < 6; i++) s += path(front, "ln fl", "rotate(" + (i * 60) + " 100 96)");
      for (i = 0; i < 6; i++) {
        var a = (-50 + i * 20) * Math.PI / 180, x = 100 + 24 * Math.sin(a), y = 96 - 36 * Math.cos(a);
        s += path("M100 96 L" + N(x) + " " + N(y), "ln") + circ(x, y, 2.6, "seed");
      }
      return s;
    },
    daisy: function () { return stem(110) + LEAVES + rad(14, 100, 92, 10, 5, 22, 0, "ln fl") + circ(100, 92, 11, "ln core"); },
    orchid: function () {
      return stem(0, "M100 128 C 102 172, 124 196, 120 256") +
        path("M120 256 C 90 250, 66 232, 62 206 C 92 212, 116 230, 120 256Z", "ln lf") + path("M120 256 C 150 250, 174 232, 178 206 C 148 212, 124 230, 120 256Z", "ln lf") +
        ell(114, 168, 5, 7, 22, "ln fl") +
        ell(100, 62, 15, 26, 0, "ln fl") + ell(120, 122, 11, 24, 28, "ln fl") + ell(80, 122, 11, 24, -28, "ln fl") +
        ell(70, 90, 30, 22, -16, "ln fl") + ell(130, 90, 30, 22, 16, "ln fl") +
        path("M100 94 C 88 100, 88 120, 100 130 C 112 120, 112 100, 100 94Z", "ln core");
    },
    peony: function () {
      return stem(138) + LEAVES + rad(8, 100, 92, 6, 18, 22, 0, "ln fl") + rad(8, 100, 92, 4, 15, 18, 22.5, "ln fl") + rad(6, 100, 92, 2, 11, 13, 0, "ln fl") + circ(100, 92, 8, "ln core") + path("M96 92 a4 4 0 1 1 8 0", "ln");
    },
    carnation: function () {
      return stem(150) + LEAVES + path("M84 116 C 86 134, 90 150, 100 154 C 110 150, 114 134, 116 116Z", "ln lf") +
        scallop(100, 88, 46, 14, "ln fl") + scallop(100, 88, 34, 12, "ln fl") + scallop(100, 88, 22, 10, "ln fl") + circ(100, 88, 5, "ln core");
    },
    lavender: function () {
      var s = stem(0, "M100 256 C 100 200, 100 120, 100 52") +
        path("M100 256 C 92 238, 84 216, 76 194 C 94 212, 100 234, 100 256Z", "ln lf") + path("M100 256 C 108 238, 116 216, 124 194 C 106 212, 100 234, 100 256Z", "ln lf");
      for (var i = 0; i < 10; i++) { var y = 66 + i * 14; s += ell(92, y, 5, 9, -24, "ln fl") + ell(108, y, 5, 9, 24, "ln fl"); }
      return s + ell(100, 46, 5, 11, 0, "ln fl");
    },
    chrysanthemum: function () {
      return stem(130) + LEAVES + rad(24, 100, 92, 6, 3.5, 28, 0, "ln fl") + rad(18, 100, 92, 4, 3.5, 22, 10, "ln fl") + rad(12, 100, 92, 2, 3, 14, 5, "ln fl") + circ(100, 92, 6, "ln core");
    },
    hydrangea: function () {
      var s = stem(140) + LEAVES;
      for (var k = 34; k >= 1; k--) {
        var r = 7.2 * Math.sqrt(k), a = k * 137.5 * Math.PI / 180, x = 100 + r * Math.cos(a), y = 90 + r * Math.sin(a);
        s += circ(x - 4.5, y, 4.5, "ln fl") + circ(x + 4.5, y, 4.5, "ln fl") + circ(x, y - 4.5, 4.5, "ln fl") + circ(x, y + 4.5, 4.5, "ln fl");
      }
      return s;
    },
    gerbera: function () {
      return stem(144) + LEAVES + rad(14, 100, 92, 12, 7, 26, 0, "ln fl") + rad(14, 100, 92, 12, 6, 20, 12.86, "ln fl") + circ(100, 92, 15, "ln core") + circ(100, 92, 8, "ln");
    }
  };
  function artSVG(key) {
    var f = ART[key] || ART.daisy;
    return '<svg viewBox="0 0 200 260" aria-hidden="true">' + f() + '</svg>';
  }

  /* ---------- page ---------- */
  var flowers = [], shop = { phone: "88669988", fb: "" }, cur = -1, target = -1, busy = false, want = null;
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var els = {};

  function fbUrl() { var u = String(shop.fb || ""); return /^https:\/\//i.test(u) ? u : ""; }
  function telHref() {
    var d = String(shop.phone || "").replace(/\D/g, "");
    return d ? "tel:" + (d.length === 8 ? "+976" + d : "+" + d) : "#";
  }
  var CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  var CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

  function shell() {
    document.documentElement.lang = lang;
    var h = '<header><div class="wrap"><a class="logo" href="index.html">Jana\'s Flowers</a><div class="hdr-r"><a class="navlink" href="index.html">' + t("home") + '</a>' +
      '<div class="lang" role="group" aria-label="Language / Хэл"><button type="button" data-act="lang" data-lang="mn" aria-pressed="' + (lang === "mn") + '">МН</button>' +
      '<button type="button" data-act="lang" data-lang="en" aria-pressed="' + (lang === "en") + '">EN</button></div></div></div></header>';
    h += '<main><section class="fhead"><div class="wrap"><p class="eyebrow">' + t("eyebrow") + '</p><h1>' + t("h1") + '</h1><p class="lead">' + t("lead") + '</p></div></section>';
    h += '<section class="viewer"><div class="wrap"><div class="picker" id="picker" role="group" aria-label="' + esc(t("pick")) + '"></div>' +
      '<div class="show"><div class="stage" id="stage"><div class="art" id="art"></div><div class="stagebar">' +
      '<button type="button" class="arrow" data-act="prev" aria-label="' + esc(t("prev")) + '">' + CHEV_L + '</button><span class="count" id="count"></span>' +
      '<button type="button" class="arrow" data-act="next" aria-label="' + esc(t("next")) + '">' + CHEV_R + '</button></div></div>' +
      '<article class="info" id="info" aria-live="polite"></article></div></div></section></main>';
    h += '<footer><div class="wrap"><span>© 2026 Jana\'s Flowers</span><span>' + esc(t("foot")) + '</span></div></footer>';
    document.getElementById("root").innerHTML = h;
    els.picker = document.getElementById("picker"); els.stage = document.getElementById("stage");
    els.art = document.getElementById("art"); els.info = document.getElementById("info"); els.count = document.getElementById("count");
  }

  function renderPicker() {
    els.picker.innerHTML = flowers.map(function (f, i) {
      return '<button type="button" class="chip" data-act="pick" data-i="' + i + '" aria-pressed="' + (i === cur) + '" style="--dot:' + hex(f.tint, "#ccc") + '"><i></i>' + esc(pick(f.nameMn, f.nameEn)) + '</button>';
    }).join("");
  }
  function renderArt(f) {
    var src = imgSrc(f.img);
    els.art.innerHTML = src ? '<img src="' + esc(src) + '" alt="' + esc(pick(f.nameMn, f.nameEn)) + '">' : artSVG(f.art);
    els.stage.style.setProperty("--tint", hex(f.tint, "#E8A0B4"));
    els.stage.style.setProperty("--petal", hex(f.petal, "#D96A7E"));
    els.stage.style.setProperty("--core", hex(f.core, "#B8405A"));
    els.count.textContent = (cur + 1 < 10 ? "0" : "") + (cur + 1) + " / " + (flowers.length < 10 ? "0" : "") + flowers.length;
  }
  function renderInfo(f) {
    var items = [];
    items.push('<p class="eyebrow">' + esc(f.latin) + '</p>');
    items.push('<h2>' + esc(pick(f.nameMn, f.nameEn)) + '</h2>');
    items.push('<p class="mean">' + esc(pick(f.meaningMn, f.meaningEn)) + '</p>');
    items.push('<p class="story">' + esc(pick(f.storyMn, f.storyEn)) + '</p>');
    if (f.colors && f.colors.length) {
      items.push('<div><p class="colhead">' + t("colors") + '</p><ul class="cols">' + f.colors.map(function (c) {
        return '<li><i style="background:' + hex(c.hex, "#ccc") + '"></i><b>' + esc(pick(c.mn, c.en)) + '</b><span>' + esc(pick(c.mMn, c.mEn)) + '</span></li>';
      }).join("") + '</ul></div>');
    }
    items.push('<dl class="kv"><div><dt>' + t("best") + '</dt><dd>' + esc(pick(f.bestMn, f.bestEn)) + '</dd></div><div><dt>' + t("care") + '</dt><dd>' + esc(pick(f.careMn, f.careEn)) + '</dd></div></dl>');
    var fb = fbUrl();
    items.push('<div class="cta">' + (fb ? '<a class="btn primary sm" href="' + esc(fb) + '" target="_blank" rel="noopener">' + t("ask") + '</a>' : '') +
      '<a class="btn ghost sm" href="' + esc(telHref()) + '">' + t("call") + ' · ' + esc(shop.phone) + '</a></div>');
    els.info.innerHTML = items.map(function (x, i) { return x.replace(">", ' style="--i:' + i + '">'); }).join("");
  }
  function mark() {
    Array.prototype.forEach.call(els.picker.children, function (b, i) { b.setAttribute("aria-pressed", String(i === cur)); });
    var active = els.picker.children[cur];
    if (active && active.scrollIntoView) { try { active.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" }); } catch (e) {} }
    try { history.replaceState(null, "", "#" + flowers[cur].id); } catch (e) {}
  }
  function swap(i) {
    cur = i; target = i;
    var f = flowers[i];
    renderArt(f); renderInfo(f); mark();
    document.title = pick(f.nameMn, f.nameEn) + " · " + (lang === "en" ? "Flower meanings" : "Цэцгийн утга") + " · Jana's Flowers";
  }
  function playIn(dir) {
    els.art.classList.remove("drawing"); els.info.classList.remove("enter");
    void els.art.offsetWidth;
    els.art.classList.add("drawing"); els.info.classList.add("enter");
    if (els.art.animate) els.art.animate([{ opacity: 0, transform: "translateX(" + (dir * 28) + "px)" }, { opacity: 1, transform: "none" }], { duration: 480, easing: "cubic-bezier(0.2, 0.7, 0.2, 1)" });
  }
  function go(i, dir) {
    var n = flowers.length;
    if (!n) return;
    i = ((i % n) + n) % n;
    if (busy) { want = { i: i, dir: dir }; target = i; return; }
    if (i === cur) return;
    target = i;
    if (!dir) dir = i > cur ? 1 : -1;
    if (cur < 0 || reduce || !els.art.animate) { swap(i); if (cur >= 0) playIn(dir); return; }
    busy = true;
    var outs = [els.art, els.info].map(function (el) {
      return el.animate([{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(" + (-dir * 28) + "px)" }], { duration: 220, easing: "ease-in", fill: "forwards" });
    });
    Promise.all(outs.map(function (a) { return a.finished; })).then(function () {
      swap(i);
      outs.forEach(function (a) { a.cancel(); });
      playIn(dir);
      setTimeout(function () {
        busy = false;
        if (want && want.i !== cur) { var w = want; want = null; go(w.i, w.dir); } else want = null;
      }, 480);
    }).catch(function () { busy = false; swap(i); });
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var a = el.getAttribute("data-act");
    if (a === "lang") {
      lang = el.getAttribute("data-lang");
      try { localStorage.setItem("jf-lang", lang); } catch (x) {}
      var keep = cur; cur = -1; shell(); if (flowers.length) { renderPicker(); go(Math.max(keep, 0)); }
    } else if (a === "pick") go(parseInt(el.getAttribute("data-i"), 10));
    else if (a === "prev") go(target - 1, -1);
    else if (a === "next") go(target + 1, 1);
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.key === "ArrowLeft") go(target - 1, -1); else if (e.key === "ArrowRight") go(target + 1, 1);
  });
  var sx = null;
  document.addEventListener("touchstart", function (e) { sx = e.target.closest && e.target.closest("#stage") ? e.touches[0].clientX : null; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) go(target + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener("hashchange", function () {
    var id = location.hash.slice(1);
    for (var i = 0; i < flowers.length; i++) if (flowers[i].id === id && i !== cur) { go(i); break; }
  });
  document.addEventListener("error", function (e) {
    if (e.target && e.target.tagName === "IMG" && e.target.closest && e.target.closest(".art")) {
      var f = flowers[cur]; if (f) { els.art.innerHTML = artSVG(f.art); els.art.classList.remove("drawing"); }
    }
  }, true);

  shell();
  els.info.innerHTML = "";
  Promise.all([
    fetch("flowers.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("bad"); return r.json(); }),
    fetch("data.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    flowers = Array.isArray(res[0]) ? res[0] : [];
    if (res[1] && res[1].shop) shop = res[1].shop;
    if (!flowers.length) throw new Error("empty");
    renderPicker();
    var id = location.hash.slice(1), start = 0;
    for (var i = 0; i < flowers.length; i++) if (flowers[i].id === id) start = i;
    swap(start);
    playIn(1);
  }).catch(function () {
    els.info.innerHTML = '<p class="msg">' + esc(t("fail")) + '</p>';
  });
})();
</script>
</body>
</html>
